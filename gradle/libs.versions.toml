[versions]
# SDK Versions
project-compileSdk = "36"
project-minSdk = "29"
project-targetSdk = "36"

# App Versions
project-versionCode = "1"
project-versionName = "1.0"

# Lib Versions
agp = "9.1.0"
coreKtx = "1.18.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.10.0"
activityCompose = "1.13.0"
kotlin = "2.3.20"
composeBom = "2026.03.01"
hilt = "2.59.2"
retrofit = "3.0.0"
okhttp = "5.3.2"
room = "2.8.4"
work = "2.11.2"
ksp = "2.3.5"
navigationCompose = "2.9.7"
kotlinSerialization = "1.10.0"
splashscreen = "1.2.0"
firebaseBom = "34.11.0"
googleServices = "4.4.4"

[libraries]
androidx-core-ktx                        = { group = "androidx.core",               name = "core-ktx",                   version.ref = "coreKtx" }
junit                                    = { group = "junit",                       name = "junit",                      version.ref = "junit" }
androidx-junit                           = { group = "androidx.test.ext",           name = "junit",                      version.ref = "junitVersion" }
androidx-espresso-core                   = { group = "androidx.test.espresso",      name = "espresso-core",              version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx           = { group = "androidx.lifecycle",          name = "lifecycle-runtime-ktx",      version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose       = { group = "androidx.lifecycle",          name = "lifecycle-runtime-compose",  version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-ktx         = { group = "androidx.lifecycle",          name = "lifecycle-viewmodel-ktx",    version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose                = { group = "androidx.activity",           name = "activity-compose",           version.ref = "activityCompose" }
androidx-compose-bom                     = { group = "androidx.compose",            name = "compose-bom",                version.ref = "composeBom" }
androidx-compose-ui                      = { group = "androidx.compose.ui",         name = "ui" }
androidx-compose-ui-graphics             = { group = "androidx.compose.ui",         name = "ui-graphics" }
androidx-compose-ui-tooling              = { group = "androidx.compose.ui",         name = "ui-tooling" }
androidx-compose-ui-tooling-preview      = { group = "androidx.compose.ui",         name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest        = { group = "androidx.compose.ui",         name = "ui-test-manifest" }
androidx-compose-ui-test-junit4          = { group = "androidx.compose.ui",         name = "ui-test-junit4" }
androidx-compose-material3               = { group = "androidx.compose.material3",  name = "material3" }

androidx-navigation-compose              = { group = "androidx.navigation",         name = "navigation-compose",               version.ref = "navigationCompose" }
kotlinx-serialization-json               = { group = "org.jetbrains.kotlinx",       name = "kotlinx-serialization-json",       version.ref = "kotlinSerialization" }
kotlinx-coroutines-play-services         = { group = "org.jetbrains.kotlinx",       name = "kotlinx-coroutines-play-services", version = "1.10.2" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material",   name = "material-icons-extended" }
androidx-core-splashscreen               = { group = "androidx.core",               name = "core-splashscreen",                version.ref = "splashscreen" }
com-google-android-material-material     = { group = "com.google.android.material", name = "material",                         version = "1.13.0" }

# Firebase
firebase-bom                             = { group = "com.google.firebase",         name = "firebase-bom",               version.ref = "firebaseBom" }
firebase-auth                            = { group = "com.google.firebase",         name = "firebase-auth-ktx" }


# Hilt (DI)
hilt-android                              = { group = "com.google.dagger", name = "hilt-android",                     version.ref = "hilt" }
hilt-compiler                             = { group = "com.google.dagger", name = "hilt-compiler",                    version.ref = "hilt" }
androidx-hilt-navigation-compose          = { group = "androidx.hilt",     name = "hilt-navigation-compose",          version = "1.3.0" }
androidx-hilt-lifecycle-viewmodel-compose = { group = "androidx.hilt",     name = "hilt-lifecycle-viewmodel-compose", version = "1.3.0" }

# WorkManager (+ Hilt Worker)
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-hilt-work        = { group = "androidx.hilt", name = "hilt-work",        version = "1.3.0" }
androidx-hilt-compiler    = { group = "androidx.hilt", name = "hilt-compiler",    version = "1.3.0" }

# Room (local)
androidx-room-runtime  = { group = "androidx.room", name = "room-runtime",  version.ref = "room" }
androidx-room-ktx      = { group = "androidx.room", name = "room-ktx",      version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# Retrofit (remote)
retrofit                 = { group = "com.squareup.retrofit2", name = "retrofit",            version.ref = "retrofit" }
retrofit-converter-moshi = { group = "com.squareup.retrofit2", name = "converter-moshi",     version.ref = "retrofit" }
moshi                    = { group = "com.squareup.moshi",     name = "moshi",               version = "1.15.2" }
moshi-kotlin             = { group = "com.squareup.moshi",     name = "moshi-kotlin",        version = "1.15.2" }
okhttp-logging           = { group = "com.squareup.okhttp3",   name = "logging-interceptor", version.ref = "okhttp" }

[plugins]
android-application  = { id = "com.android.application",                   version.ref = "agp" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose",       version.ref = "kotlin" }
hilt-android         = { id = "com.google.dagger.hilt.android",            version.ref = "hilt" }
ksp                  = { id = "com.google.devtools.ksp",                   version.ref = "ksp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
google-services      = { id = "com.google.gms.google-services",            version.ref = "googleServices" }

